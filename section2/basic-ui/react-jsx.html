<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webpage with React</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>

    <script>
        const nestedElement = (
        <div id="root">
            <div id="parent">
                <div id="child1">
                    <h1 style={{ color: "red" }}>I am an h1 tag inside child 1</h1>
                    <h2>I am an h2 tag inside child 1</h2>
                </div>
                <div id="child2">
                    <h1 style={{ color: "green" }}>I am an h1 tag inside child 2</h1>
                    <h2>I am an h2 tag inside child 2</h2>
                </div>
            </div>
        </div>
        );

        ReactDOM.render(nestedElement, document.getElementById("root"));
    </script>
</body>
</html>
