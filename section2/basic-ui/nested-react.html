<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Webpage with React</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>

    <script>
        const nestedElement = React.createElement(
            "div",
            { id: "parent" },
            [
                React.createElement(
                    "div",
                    { id: "child1" },
                    [
                        React.createElement(
                            "h1",
                            { style: { color: "red" } },
                            "I am an h1 tag inside child 1"
                        ),
                        React.createElement(
                            "h2",
                            null,
                            "I am an h2 tag inside child 1"
                        )
                    ]
                ),
                React.createElement(
                    "div",
                    { id: "child2" },
                    [
                        React.createElement(
                            "h1",
                            { style: { color: "green" } },
                            "I am an h1 tag inside child 2"
                        ),
                        React.createElement(
                            "h2",
                            null,
                            "I am an h2 tag inside child 2"
                        )
                    ]
                )
            ]
        );

        ReactDOM.render(nestedElement, document.getElementById("root"));
    </script>
</body>
</html>
